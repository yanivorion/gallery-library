<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#eeeeee; --surface:#ffffff; --surface-2:#eeeeee;
  --ink:#222222; --ink-2:#444444; --muted:#777777; --line:#dddddd;
  --accent:#555555; --accent-soft:#dddddd; --accent-ink:#444444;
  --clay:#555555; --clay-soft:#dddddd;
  --slate:#555555; --slate-soft:#dddddd;
  --amber:#666666; --amber-soft:#eeeeee;
  --shadow:0 1px 2px rgba(34, 34, 34, .07);
  --shadow-lg:0 10px 30px -12px rgba(34, 34, 34, .28);
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111111; --surface:#222222; --surface-2:#222222;
    --ink:#eeeeee; --ink-2:#bbbbbb; --muted:#888888; --line:#333333;
    --accent:#aaaaaa; --accent-soft:#333333; --accent-ink:#cccccc;
    --clay:#999999; --clay-soft:#222222;
    --slate:#aaaaaa; --slate-soft:#222222;
    --amber:#bbbbbb; --amber-soft:#333333;
    --shadow:0 1px 2px rgba(0, 0, 0, .45);
    --shadow-lg:0 10px 30px -12px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"]{
  --paper:#111111; --surface:#222222; --surface-2:#222222;
  --ink:#eeeeee; --ink-2:#bbbbbb; --muted:#888888; --line:#333333;
  --accent:#aaaaaa; --accent-soft:#333333; --accent-ink:#cccccc;
  --clay:#999999; --clay-soft:#222222;
  --slate:#aaaaaa; --slate-soft:#222222;
  --amber:#bbbbbb; --amber-soft:#333333;
  --shadow:0 1px 2px rgba(0, 0, 0, .45);
  --shadow-lg:0 10px 30px -12px rgba(0, 0, 0, .7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.bar{max-width:1760px;margin:0 auto;padding:14px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{
  font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight:700; font-size:19px; margin:0; letter-spacing:-.015em;
}
.brand .sub{font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;color:var(--muted);letter-spacing:.04em}

.field{position:relative;display:flex;align-items:center}
.field input[type=search]{
  width:260px;padding:7px 11px 7px 30px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface);outline:none;
}
.field input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .mag{position:absolute;left:10px;color:var(--muted);font-size:12px;pointer-events:none}

select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);outline:none}
select:focus{border-color:var(--accent)}

.btn{
  padding:7px 12px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);cursor:pointer;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease;
}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* ---------- facet rail ---------- */
.facets{max-width:1760px;margin:0 auto;padding:0 22px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{
  font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;letter-spacing:.02em;
  padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);cursor:pointer;
}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{opacity:.55;margin-left:5px}

/* ---------- grid ---------- */
main{max-width:1760px;margin:0 auto;padding:18px 22px 80px}
.meta-line{
  font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;color:var(--muted);
  margin:0 0 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;
}
.grid{display:grid;gap:18px}
.grid.sz-s{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid.sz-m{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.grid.sz-l{grid-template-columns:repeat(auto-fill,minmax(640px,1fr))}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease;
}
.card:hover{box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}

.stage{
  position:relative;background:#ffffff;border-bottom:1px solid var(--line);
  overflow:hidden;cursor:zoom-in;
}
.stage .shot{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:top center;display:block;
}
.stage .holder{
  position:absolute;inset:0;overflow:hidden;overscroll-behavior:contain;
  opacity:0;transition:opacity .22s ease;
}
.stage.live .holder{opacity:1}
@media (prefers-reduced-motion:reduce){.stage .holder{transition:none}}
.stage iframe{border:0;display:block;transform-origin:0 0;background:#ffffff}
.stage .veil{position:absolute;inset:0;background:transparent}
.stage.live .veil{display:none}
.stage .badge{
  position:absolute;left:8px;bottom:8px;z-index:3;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;
  background:rgba(255,255,255,.88);color:#687384;border:1px solid var(--line);
}
.stage.live .badge{background:rgba(24,32,43,.82);color:#fff;border-color:transparent}

.card .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.ttl{display:flex;align-items:flex-start;gap:8px}
.ttl h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.25;letter-spacing:-.008em;flex:1}
.type{font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;color:var(--muted);word-break:break-all}
.desc{font-size:12.5px;color:var(--ink-2);margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px;align-items:center}
.tag{
  font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;letter-spacing:.03em;
  padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);
}
.tag.fam{background:var(--slate-soft);color:var(--slate)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.dot.pass{background:var(--accent)} .dot.warn{background:var(--amber)} .dot.fail{background:var(--clay)}
.card .acts{display:flex;gap:5px;margin-left:auto}
.mini{
  font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;padding:3px 7px;
  border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer;
}
.mini:hover{background:var(--surface-2)}

/* ---------- detail ---------- */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(17, 17, 17, .62);
  backdrop-filter:blur(3px);display:none;
}
.scrim.open{display:block}
.sheet{
  position:absolute;inset:26px;background:var(--paper);border-radius:14px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--line);
}
.sheet .head{
  display:flex;gap:12px;align-items:center;padding:12px 16px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;
}
.sheet .head h2{margin:0;font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:17px;font-weight:700}
.sheet .head .type{font-size:11px}
.sheet .head .spacer{margin-left:auto}
.sheet .wrapb{flex:1;display:flex;min-height:0}
.sheet .view{flex:1;min-width:0;background:#999999;display:flex;justify-content:center;overflow:auto;padding:18px}
.sheet .view iframe{border:0;background:#ffffff;box-shadow:0 8px 28px -10px rgba(0, 0, 0, .5);border-radius:6px}
.side{
  width:360px;flex:0 0 360px;border-left:1px solid var(--line);background:var(--surface);
  overflow:auto;padding:14px 16px 40px;
}
.side h4{
  margin:18px 0 8px;font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
}
.side h4:first-child{margin-top:0}
.kv{width:100%;border-collapse:collapse;font-size:12px}
.kv td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.kv td:first-child{font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;color:var(--muted);white-space:nowrap;width:42%}
.kv td:last-child{word-break:break-word}
pre.code{
  margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  padding:11px;font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;line-height:1.45;
  max-height:none;overflow:auto;white-space:pre;
}
.banner{
  padding:8px 10px;border-radius:7px;font-size:12px;margin-bottom:10px;
  font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;line-height:1.45;word-break:break-word;
}
.banner.warn{background:var(--amber-soft);color:var(--amber)}
.banner.fail{background:var(--clay-soft);color:var(--clay)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.hidden{display:none !important}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <h1>Gallery Library</h1>
      <span class="sub" id="brandSub">loading…</span>
    </div>
    <div class="field">
      <span class="mag">⌕</span>
      <input type="search" id="q" placeholder="Search name, type, description…" autocomplete="off">
    </div>
    <select id="packSel"><option value="">All packs</option></select>
    <select id="statusSel">
      <option value="">All statuses</option>
      <option value="pass">Clean</option>
      <option value="warn">Console warnings</option>
      <option value="fail">Failed</option>
    </select>
    <select id="sortSel">
      <option value="name">Sort: name</option>
      <option value="family">Sort: family</option>
      <option value="props">Sort: most props</option>
      <option value="size">Sort: most code</option>
      <option value="height">Sort: tallest</option>
    </select>
    <div class="seg" role="group" aria-label="Preview size">
      <button data-sz="s">S</button><button data-sz="m" aria-pressed="true">M</button><button data-sz="l">L</button>
    </div>
    <button class="btn" id="liveBtn" aria-pressed="true" title="Mount previews as they scroll into view">● Live</button>
    <button class="btn" id="themeBtn" title="Toggle theme">◐</button>
  </div>
  <div class="facets" id="facets"></div>
</header>

<main>
  <p class="meta-line" id="metaLine"></p>
  <div class="grid sz-m" id="grid"></div>
  <div class="empty hidden" id="empty">Nothing matches those filters.</div>
</main>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Component detail">
    <div class="head">
      <h2 id="dTitle"></h2>
      <span class="type" id="dType"></span>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="Viewport">
        <button data-vp="1440" aria-pressed="true">1440</button>
        <button data-vp="1024">1024</button>
        <button data-vp="768">768</button>
        <button data-vp="390">390</button>
      </div>
      <button class="btn" id="dReload">↻ Re-run</button>
      <button class="btn" id="dOpen">↗ Own tab</button>
      <button class="btn" id="dClose">✕ Close</button>
    </div>
    <div class="wrapb">
      <div class="view" id="dView"></div>
      <aside class="side" id="dSide"></aside>
    </div>
  </div>
</div>

<script src="library.js"></script>
<script>
(function () {
  var ITEMS = window.__GALLERY_INDEX__ || [];
  var RUN = {};          // slug -> run result
  var state = {
    q: '', pack: '', status: '', family: '', sort: 'name', size: 'm', live: true
  };

  var grid = document.getElementById('grid');
  var metaLine = document.getElementById('metaLine');
  var emptyEl = document.getElementById('empty');
  var facetsEl = document.getElementById('facets');

  // ---------- run results ----------
  fetch('run-results.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j) return;
      (j.results || []).forEach(function (r) { RUN[r.slug] = r; });
      document.getElementById('brandSub').textContent =
        ITEMS.length + ' components · ' + j.pass + ' clean · ' + j.warn + ' warn · ' + j.fail + ' fail';
      render();
    })
    .catch(function () {
      document.getElementById('brandSub').textContent = ITEMS.length + ' components';
    });

  function statusOf(slug) {
    var r = RUN[slug];
    if (!r) return 'unknown';
    if (!r.ok) return 'fail';
    if (r.blank) return 'warn';
    return (r.consoleErrorCount || 0) > 0 ? 'warn' : 'pass';
  }

  // ---------- facets ----------
  var families = {};
  ITEMS.forEach(function (it) { families[it.family] = (families[it.family] || 0) + 1; });
  var famKeys = Object.keys(families).sort(function (a, b) {
    return families[b] - families[a] || a.localeCompare(b);
  });

  function buildFacets() {
    facetsEl.innerHTML = '';
    var all = document.createElement('button');
    all.className = 'chip';
    all.setAttribute('aria-pressed', state.family === '');
    all.innerHTML = 'All <span class="n">' + ITEMS.length + '</span>';
    all.onclick = function () { state.family = ''; buildFacets(); render(); };
    facetsEl.appendChild(all);

    famKeys.forEach(function (f) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.setAttribute('aria-pressed', state.family === f);
      b.innerHTML = f + ' <span class="n">' + families[f] + '</span>';
      b.onclick = function () { state.family = (state.family === f ? '' : f); buildFacets(); render(); };
      facetsEl.appendChild(b);
    });
  }

  var packSel = document.getElementById('packSel');
  [1, 2, 3, 4].forEach(function (n) {
    var o = document.createElement('option');
    o.value = String(n);
    o.textContent = 'Pack ' + n + '/4';
    packSel.appendChild(o);
  });

  // ---------- filtering ----------
  function visible() {
    var q = state.q.trim().toLowerCase();
    var out = ITEMS.filter(function (it) {
      if (state.family && it.family !== state.family) return false;
      if (state.pack && String(it.packNo) !== state.pack) return false;
      if (state.status && statusOf(it.slug) !== state.status) return false;
      if (!q) return true;
      return (it.name + ' ' + it.type + ' ' + it.description + ' ' + it.slug)
        .toLowerCase().indexOf(q) !== -1;
    });
    var cmp = {
      name: function (a, b) { return a.name.localeCompare(b.name); },
      family: function (a, b) { return a.type.localeCompare(b.type); },
      props: function (a, b) { return b.propCount - a.propCount; },
      size: function (a, b) { return b.codeBytes - a.codeBytes; },
      height: function (a, b) { return ((RUN[b.slug] || {}).height || 0) - ((RUN[a.slug] || {}).height || 0); }
    }[state.sort];
    return out.sort(cmp);
  }

  // ---------- previews ----------
  // Every card shows its captured frame. When Live is on, the component is
  // mounted in an iframe on top of that frame while the card is near the
  // viewport, so a card is never blank and nothing flickers as you scroll.
  var STAGE_W = 1440;

  // Components can scroll their own ancestors (scrollIntoView inside a frame
  // reaches the parent), which used to drag the grid around and unmount the
  // cards you were looking at. Keep the page where the reader left it.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  var lastUserScroll = 0;
  var anchor = 0;
  ['wheel', 'touchstart', 'touchmove', 'keydown', 'mousedown'].forEach(function (ev) {
    window.addEventListener(ev, function () { lastUserScroll = Date.now(); }, { passive: true });
  });
  window.addEventListener('scroll', function () {
    var moved = Math.abs(window.scrollY - anchor);
    // Within 500ms of real input, or for a small step, the reader did it.
    if (Date.now() - lastUserScroll < 500 || moved < 300) { anchor = window.scrollY; return; }
    // A big jump with no input behind it came from a frame. Put it back.
    window.scrollTo(0, anchor);
  }, { passive: true });

  // frame.html posts a report once it has mounted and settled. Until then the
  // card keeps showing its captured frame, so nothing flashes white.
  window.addEventListener('message', function (e) {
    if (!e.data || !e.data.__gallery) return;
    var slug = e.data.report && e.data.report.slug;
    if (!slug) return;
    var stage = grid.querySelector('.stage[data-slug="' + slug + '"]');
    if (stage && stage.dataset.mounted === '1') stage.classList.add('live');
  });

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) mount(e.target);
    });
  }, { rootMargin: '500px 0px' });

  // A second, much wider band decides when a mounted frame is far enough away
  // to drop. The gap between the two margins is the hysteresis that stops a
  // card mounting and unmounting on every scroll tick.
  var reaper = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) unmount(e.target);
    });
  }, { rootMargin: '2000px 0px' });

  function mount(stage) {
    if (!state.live || stage.dataset.mounted === '1') return;
    stage.dataset.mounted = '1';
    var holder = stage.querySelector('.holder');
    var scale = stage.clientWidth / STAGE_W;
    var f = document.createElement('iframe');
    f.src = 'frame.html?c=' + encodeURIComponent(stage.dataset.slug);
    f.width = STAGE_W;
    f.height = Math.round(stage.clientHeight / scale);
    f.style.transform = 'scale(' + scale + ')';
    f.setAttribute('tabindex', '-1');
    f.setAttribute('aria-hidden', 'true');
    f.setAttribute('scrolling', 'no');
    holder.innerHTML = '';
    holder.appendChild(f);
  }

  function unmount(stage) {
    if (stage.dataset.mounted !== '1') return;
    stage.dataset.mounted = '0';
    stage.classList.remove('live');
    stage.querySelector('.holder').innerHTML = '';
  }

  // ---------- cards ----------
  function previewHeight() {
    return { s: 190, m: 265, l: 400 }[state.size];
  }

  function card(it) {
    var st = statusOf(it.slug);
    var r = RUN[it.slug] || {};
    var el = document.createElement('article');
    el.className = 'card';

    var stage = document.createElement('div');
    stage.className = 'stage';
    stage.style.height = previewHeight() + 'px';
    stage.dataset.slug = it.slug;
    stage.title = 'Open ' + it.name;
    var shot = document.createElement('img');
    shot.className = 'shot';
    shot.src = 'thumbs/' + it.slug + '.webp';
    shot.alt = it.name + ' — captured frame';
    shot.loading = 'lazy';
    shot.decoding = 'async';
    stage.appendChild(shot);
    stage.insertAdjacentHTML('beforeend',
      '<div class="holder"></div><div class="veil"></div>' +
      '<span class="badge">' + (state.live ? 'live' : 'frame') + '</span>');
    stage.onclick = function () { openDetail(it); };

    var body = document.createElement('div');
    body.className = 'body';
    body.innerHTML =
      '<div class="ttl">' +
        '<span class="dot ' + st + '" title="' + st + '"></span>' +
        '<h3></h3>' +
      '</div>' +
      '<div class="type"></div>' +
      '<p class="desc"></p>' +
      '<div class="tags">' +
        '<span class="tag fam"></span>' +
        '<span class="tag">' + it.propCount + ' props</span>' +
        '<span class="tag">p' + it.packNo + '</span>' +
        (r.renderMs ? '<span class="tag">' + r.domNodes + ' nodes</span>' : '') +
        '<span class="acts">' +
          '<button class="mini" data-act="open">open</button>' +
          '<button class="mini" data-act="code">code</button>' +
        '</span>' +
      '</div>';
    body.querySelector('h3').textContent = it.name;
    body.querySelector('.type').textContent = it.type;
    body.querySelector('.desc').textContent = it.description || '—';
    body.querySelector('.tag.fam').textContent = it.family;
    body.querySelector('[data-act=open]').onclick = function (e) { e.stopPropagation(); openDetail(it); };
    body.querySelector('[data-act=code]').onclick = function (e) {
      e.stopPropagation(); openDetail(it, true);
    };

    el.appendChild(stage);
    el.appendChild(body);
    observer.observe(stage);
    reaper.observe(stage);
    return el;
  }

  function render() {
    var list = visible();
    grid.className = 'grid sz-' + state.size;
    observer.disconnect();
    reaper.disconnect();
    grid.innerHTML = '';
    list.forEach(function (it) { grid.appendChild(card(it)); });
    emptyEl.classList.toggle('hidden', list.length > 0);
    anchor = window.scrollY;

    var counts = { pass: 0, warn: 0, fail: 0, unknown: 0 };
    list.forEach(function (it) { counts[statusOf(it.slug)]++; });
    metaLine.textContent =
      'showing ' + list.length + ' of ' + ITEMS.length +
      '   ·   ' + counts.pass + ' clean, ' + counts.warn + ' warn, ' + counts.fail + ' fail' +
      (counts.unknown ? ', ' + counts.unknown + ' not run' : '') +
      (state.live ? '' : '   ·   captured frames');
  }

  // ---------- detail ----------
  var scrim = document.getElementById('scrim');
  var dView = document.getElementById('dView');
  var dSide = document.getElementById('dSide');
  var current = null;
  var vp = 1440;

  function openDetail(it, showCode) {
    current = it;
    document.getElementById('dTitle').textContent = it.name;
    document.getElementById('dType').textContent = it.type + '  ·  pack ' + it.packNo;
    scrim.classList.add('open');
    document.body.style.overflow = 'hidden';
    loadDetailFrame();
    renderSide(it, showCode);
  }

  function loadDetailFrame() {
    if (!current) return;
    var r = RUN[current.slug] || {};
    var h = Math.max(760, Math.min(r.height || 900, 4200));
    dView.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = 'frame.html?c=' + encodeURIComponent(current.slug) + '&_=' + Date.now();
    f.width = vp;
    f.height = h;
    f.style.width = vp + 'px';
    f.style.height = h + 'px';
    dView.appendChild(f);
  }

  function row(k, v) {
    return '<tr><td>' + k + '</td><td>' + String(v == null ? '—' : v)
      .replace(/[&<>]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; }) +
      '</td></tr>';
  }

  function renderSide(it, showCode) {
    var r = RUN[it.slug] || {};
    var st = statusOf(it.slug);
    var html = '';

    if (st === 'fail') {
      html += '<div class="banner fail"><b>Failed to run</b><br>' +
        (r.error || 'unknown') + '</div>';
    } else if (r.blank) {
      html += '<div class="banner warn"><b>Mounts, but paints nothing</b><br>' +
        r.blankNote + '</div>';
    } else if (st === 'warn') {
      html += '<div class="banner warn"><b>Runs, with ' + r.consoleErrorCount +
        ' console error(s)</b><br>' + (r.consoleErrors || []).join('<br><br>') + '</div>';
    }

    html += '<h4>Run</h4><table class="kv">' +
      row('status', st) +
      row('mount + settle', r.renderMs != null ? r.renderMs + ' ms' : '—') +
      row('DOM nodes', r.domNodes) +
      row('rendered height', r.height ? r.height + ' px' : '—') +
      row('visible text', r.textLength != null ? r.textLength + ' chars' : '—') +
      '</table>';

    html += '<h4>Component</h4><table class="kv">' +
      row('type', it.type) +
      row('archetype', it.archetype) +
      row('selector', it.selector) +
      row('editable props', it.propCount) +
      row('prop groups', it.groups.join(', ')) +
      row('source size', (it.codeBytes / 1024).toFixed(1) + ' KB') +
      row('pack', it.pack) +
      '</table>';

    html += '<h4>Description</h4><p style="margin:0;font-size:12.5px;color:var(--ink-2)">' +
      (it.description || '—') + '</p>';

    var cfgKeys = Object.keys(it.config);
    html += '<h4>Config (' + cfgKeys.length + ')</h4><table class="kv">';
    cfgKeys.forEach(function (k) {
      var v = it.config[k];
      html += row(k, typeof v === 'string' && v.length > 70 ? v.slice(0, 70) + '…' : String(v));
    });
    html += '</table>';

    html += '<h4>Source</h4>' +
      '<button class="btn" id="codeToggle" style="width:100%">Show JSX source</button>' +
      '<pre class="code hidden" id="codeBox">loading…</pre>';

    dSide.innerHTML = html;
    dSide.scrollTop = 0;

    var toggle = document.getElementById('codeToggle');
    var box = document.getElementById('codeBox');
    var loaded = false;
    toggle.onclick = function () {
      var hiding = !box.classList.contains('hidden');
      box.classList.toggle('hidden');
      toggle.textContent = hiding ? 'Show JSX source' : 'Hide JSX source';
      if (!loaded && !hiding) {
        loaded = true;
        fetch('components/' + it.slug + '.jsx.txt')
          .then(function (res) { return res.text(); })
          .then(function (t) { box.textContent = t; });
      }
    };
    if (showCode) toggle.click();
  }

  function closeDetail() {
    scrim.classList.remove('open');
    dView.innerHTML = '';
    document.body.style.overflow = '';
    current = null;
  }

  document.getElementById('dClose').onclick = closeDetail;
  document.getElementById('dReload').onclick = loadDetailFrame;
  document.getElementById('dOpen').onclick = function () {
    if (current) window.open('frame.html?c=' + encodeURIComponent(current.slug), '_blank');
  };
  scrim.onclick = function (e) { if (e.target === scrim) closeDetail(); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && scrim.classList.contains('open')) closeDetail();
  });
  document.querySelectorAll('[data-vp]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-vp]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      vp = Number(b.dataset.vp);
      loadDetailFrame();
    };
  });

  // ---------- controls ----------
  var qEl = document.getElementById('q');
  var t;
  qEl.oninput = function () { clearTimeout(t); t = setTimeout(function () { state.q = qEl.value; render(); }, 140); };
  packSel.onchange = function () { state.pack = packSel.value; render(); };
  document.getElementById('statusSel').onchange = function () { state.status = this.value; render(); };
  document.getElementById('sortSel').onchange = function () { state.sort = this.value; render(); };
  document.querySelectorAll('[data-sz]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-sz]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      state.size = b.dataset.sz;
      render();
    };
  });
  var liveBtn = document.getElementById('liveBtn');
  liveBtn.onclick = function () {
    state.live = !state.live;
    liveBtn.setAttribute('aria-pressed', String(state.live));
    liveBtn.textContent = state.live ? '● Live' : '▣ Frames';
    liveBtn.title = state.live
      ? 'Mounting components as they scroll into view'
      : 'Showing the captured frame for each component';
    render();
  };
  var themeBtn = document.getElementById('themeBtn');
  themeBtn.onclick = function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('gl-theme', next); } catch (e) {}
  };
  try {
    var saved = localStorage.getItem('gl-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}

  buildFacets();
  render();
})();
</script>
</body>
</html>
