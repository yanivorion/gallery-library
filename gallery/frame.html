<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery Frame</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff;color:#111111;
    font-family:'Neue Haas Grotesk Display Pro', 'Neue Haas Grotesk Text Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  #root{min-height:100vh}
  .gl-err{padding:24px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#333333;background:#ffffff;white-space:pre-wrap;word-break:break-word}
  .gl-err b{display:block;font:600 12px/1.4 -apple-system,sans-serif;
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;color:#444444}
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var slug = params.get('c');
  var t0 = performance.now();

  var report = {
    slug: slug,
    ok: false,
    phase: 'init',
    error: null,
    stack: null,
    consoleErrors: [],
    consoleWarnings: [],
    renderMs: null,
    domNodes: 0,
    height: 0,
    textLength: 0
  };

  // ---- capture console noise -------------------------------------------
  ['error', 'warn'].forEach(function (lvl) {
    var orig = console[lvl];
    console[lvl] = function () {
      var msg = Array.prototype.map.call(arguments, function (a) {
        if (a instanceof Error) return a.message;
        if (typeof a === 'string') return a;
        try { return JSON.stringify(a); } catch (e) { return String(a); }
      }).join(' ');
      var bucket = lvl === 'error' ? report.consoleErrors : report.consoleWarnings;
      if (bucket.length < 12) bucket.push(msg.slice(0, 400));
      return orig.apply(console, arguments);
    };
  });

  window.addEventListener('error', function (e) {
    if (report.consoleErrors.length < 12) {
      report.consoleErrors.push('[window.onerror] ' + (e.message || String(e.error)));
    }
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (report.consoleErrors.length < 12) {
      report.consoleErrors.push('[unhandledrejection] ' + String(e.reason && e.reason.message || e.reason));
    }
  });

  function showError(title, msg, stack) {
    report.error = msg;
    report.stack = stack || null;
    document.getElementById('root').innerHTML =
      '<div class="gl-err"><b>' + title + '</b>' +
      String(msg).replace(/[&<>]/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
      }) + '</div>';
  }

  function send() {
    report.height = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0
    );
    report.domNodes = document.querySelectorAll('#root *').length;
    var root = document.getElementById('root');
    report.textLength = root ? (root.innerText || '').trim().length : 0;
    window.__gallery_report = report;
    try {
      parent.postMessage({ __gallery: true, report: report }, '*');
    } catch (e) { /* ignore */ }
  }

  // ---- error boundary ---------------------------------------------------
  function makeBoundary(React) {
    var EB = function (props) { React.Component.call(this, props); this.state = { err: null }; };
    EB.prototype = Object.create(React.Component.prototype);
    EB.prototype.constructor = EB;
    EB.getDerivedStateFromError = function (err) { return { err: err }; };
    EB.prototype.componentDidCatch = function (err, info) {
      report.phase = 'render';
      report.error = err && err.message ? err.message : String(err);
      report.stack = (info && info.componentStack ? info.componentStack : (err && err.stack) || '').slice(0, 1500);
    };
    EB.prototype.render = function () {
      if (this.state.err) {
        var e = this.state.err;
        return React.createElement('div', { className: 'gl-err' },
          React.createElement('b', null, 'Runtime error while rendering'),
          (e && e.message) || String(e));
      }
      return this.props.children;
    };
    return EB;
  }

  // ---- load + run -------------------------------------------------------
  var script = document.createElement('script');
  script.src = 'components/' + encodeURIComponent(slug) + '.js';

  script.onerror = function () {
    report.phase = 'load';
    showError('Could not load component module', 'components/' + slug + '.js failed to load.');
    send();
  };

  script.onload = function () {
    var factory = window.__GALLERY_MODULES__ && window.__GALLERY_MODULES__[slug];
    if (!factory) {
      report.phase = 'load';
      showError('Module registered nothing', 'No factory found for "' + slug + '".');
      return send();
    }

    var mod;
    try {
      report.phase = 'evaluate';
      mod = factory(React);
    } catch (err) {
      showError('Error evaluating component module', err.message, err.stack);
      return send();
    }

    if (!mod || typeof mod.Component !== 'function') {
      report.phase = 'evaluate';
      showError('No Component export', 'The module did not return a Component function.');
      return send();
    }

    var config = {};
    try {
      config = JSON.parse(decodeURIComponent(params.get('config') || '')) || {};
    } catch (e) {
      // fall back to the manifest defaults below
    }
    if (!params.get('config') && mod.MANIFEST) {
      var data = (mod.MANIFEST.editorElement && mod.MANIFEST.editorElement.data) || {};
      Object.keys(data).forEach(function (k) {
        if (data[k] && 'defaultValue' in data[k]) config[k] = data[k].defaultValue;
      });
    }

    try {
      report.phase = 'mount';
      var EB = makeBoundary(React);
      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(EB, null, React.createElement(mod.Component, { config: config })));
    } catch (err) {
      showError('Error mounting component', err.message, err.stack);
      return send();
    }

    // Give effects, rAF loops, transitions and IntersectionObservers a beat.
    setTimeout(function () {
      report.renderMs = Math.round(performance.now() - t0);
      if (!report.error) {
        report.phase = 'done';
        report.ok = true;
      }
      send();
    }, 900);
  };

  document.head.appendChild(script);
})();
</script>
</body>
</html>
